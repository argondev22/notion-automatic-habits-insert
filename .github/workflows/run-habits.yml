name: Run Habit Scheduler

on:
  schedule:
    # 12:00 UTC = 21:00 JST. Deliberately later than the intended 21:00 JST
    # run time to leave margin for GitHub Actions' scheduling delay.
    - cron: "0 12 * * *"
  workflow_dispatch: {}

jobs:
  run:
    name: Create scheduled habits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: ./app
        run: npm ci

      - name: Build
        working-directory: ./app
        run: npm run build

      - name: Run habit scheduler
        working-directory: ./app
        run: node dist/main.js
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          TIMEBOX_DATABASE_ID: ${{ secrets.TIMEBOX_DATABASE_ID }}
          TIMEZONE: Asia/Tokyo
