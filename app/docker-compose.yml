services:
  # Local one-shot verification: `docker compose run --rm app` (or `up`) runs
  # the habit-creation job once and exits — there is no long-lived service.
  app:
    image: argondev22/notion-automatic-habits-insert:latest
    build:
      context: .
      target: development
    environment:
      # Notion API設定
      - NOTION_TOKEN=${NOTION_TOKEN}
      - TIMEBOX_DATABASE_ID=${TIMEBOX_DATABASE_ID}
      - TIMEZONE=${TIMEZONE:-Asia/Tokyo}
      # ログレベル（オプション）
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - .:/app/
      - /app/node_modules
      - /app/dist
